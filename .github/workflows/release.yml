name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/gh-stats.yml'
      - '.gh-stats.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release (e.g. v0.2.0, leave empty to auto-calculate)'
        required: false
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write

jobs:
  goreleaser:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and Create Tag
        id: resolve_tag
        run: |
          git fetch --tags --force

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            HEAD_TAG=$(git tag --points-at HEAD | head -n1 || true)
            if [ -n "$HEAD_TAG" ]; then
              TAG_NAME="$HEAD_TAG"
            else
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
              CLEAN_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
              MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
              PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)

              COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b" 2>/dev/null || git log --pretty=format:"%s%n%b")

              if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|^[a-zA-Z]+(\([^\)]+\))?!:)"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMITS" | grep -qE "^feat(\([^\)]+\))?:"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi

              TAG_NAME="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release target tag: ${TAG_NAME} (version: ${VERSION})"

          if ! git tag --points-at HEAD | grep -qx "$TAG_NAME"; then
            echo "Tagging HEAD as ${TAG_NAME}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release ${TAG_NAME}"
            git push origin "$TAG_NAME"
          else
            echo "HEAD is already tagged as ${TAG_NAME}."
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Homebrew Formula
        id: formula
        run: |
          TAG_NAME="${{ steps.resolve_tag.outputs.tag }}"
          VERSION="${{ steps.resolve_tag.outputs.version }}"
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh "$VERSION" "$TAG_NAME" "dist" "dist/aws-cost-report.rb"

      - name: Upload Formula to Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          gh release upload "$TAG_NAME" dist/aws-cost-report.rb --clobber

      - name: Publish Homebrew Formula to Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated formula to smford/homebrew-tap..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Formula
            cp dist/aws-cost-report.rb tap_repo/Formula/aws-cost-report.rb
            cd tap_repo
            git add Formula/aws-cost-report.rb
            if git commit -m "feat(formula): update aws-cost-report to ${TAG_NAME}"; then
              git push origin main
              echo "Successfully pushed formula update to smford/homebrew-tap"
            else
              echo "Formula in tap is already up to date"
            fi
            cd ..
            rm -rf tap_repo
          else
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN secret is not set. Formula available in release assets."
          fi

      - name: Trigger GitHub Pages Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          echo "Triggering GitHub Pages deployment for ${TAG_NAME}..."
          gh workflow run pages.yml -f version="${TAG_NAME}" || true
