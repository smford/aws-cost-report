name: AWS Cost Report

on:
  schedule:
    # Run at 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      months:
        description: 'Number of full months back to report'
        required: false
        default: '1'
      format:
        description: 'Report output format (table, markdown, json, csv)'
        required: false
        default: 'markdown'
      compare:
        description: 'Include Month-over-Month comparison'
        required: false
        default: 'true'

permissions:
  id-token: write
  contents: read

jobs:
  report:
    name: Generate Monthly Cost Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Run AWS Cost Report Action
        uses: ./
        with:
          format: ${{ github.event.inputs.format || 'markdown' }}
          compare: ${{ github.event.inputs.compare || 'true' }}
          months: ${{ github.event.inputs.months || '1' }}
          mock: ${{ secrets.AWS_ROLE_ARN == '' && 'true' || 'false' }}
