version: "1"
# Optional human-readable name for the AWS account (displayed alongside Account ID in report headers)
name: "Production Core"

defaults:
  currency: "USD"
  months_back: 1
  min_display_cost: 0.01
  top: 10 # 0 displays all, >0 displays top N and aggregates remainder into "Other"
  metrics:
    - "UnblendedCost"
    - "BlendedCost"
    - "AmortizedCost"

grouping:
  type: "DIMENSION" # DIMENSION or TAG (e.g. type: "TAG", key: "Environment" to group by tag and identify Untagged / Other costs)
  key: "SERVICE"    # SERVICE, LINKED_ACCOUNT, or Cost Allocation Tag Key

budget:
  fail_on_threshold: 0.00 # 0.00 disables exit-1 behavior

reporting:
  format: "table" # table, markdown, json, csv
  write_job_summary: true

# Friendly account aliases for LINKED_ACCOUNT grouping and metadata display
accounts:
  "123456789012": "Production Core"
  "987654321098": "Staging / QA"

# Optional webhook integrations (supports environment variable expansion: ${SLACK_WEBHOOK_URL:-})
slack_webhook: "${SLACK_WEBHOOK_URL:-}"
teams_webhook: "${TEAMS_WEBHOOK_URL:-}"

# Optional service filters: official AWS Cost Explorer names ("Amazon DynamoDB"), common aliases ("S3", "EC2"), or substrings
filters: []

# Optional tag filters to scope billing to specific cost allocation tags (Key: [Values])
tag_filters:
  Environment:
    - "Production"
  # Project:
  #   - "BillingEngine"
