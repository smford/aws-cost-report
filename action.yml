name: 'AWS Cost Report'
description: 'Production AWS Cost Explorer reporting, Month-over-Month delta tracking, and CI/CD budget guardrail.'
author: 'Stephen Ford <stephen@stephenford.org>'
branding:
  icon: 'dollar-sign'
  color: 'yellow'

inputs:
  version:
    description: 'Version of aws-cost-report binary to execute (e.g. v0.7.0, latest, or local)'
    required: false
    default: 'latest'
  compare:
    description: 'Include Month-over-Month comparison with preceding period (true/false)'
    required: false
    default: 'true'
  format:
    description: 'Report output format (markdown, table, html, json, csv, prometheus, minimal)'
    required: false
    default: 'markdown'
  months:
    description: 'Number of historical full months back to query'
    required: false
    default: '1'
  start:
    description: 'Explicit start date (YYYY-MM-01 or YYYY-MM-DD)'
    required: false
    default: ''
  end:
    description: 'Explicit end date (YYYY-MM-01 or YYYY-MM-DD)'
    required: false
    default: ''
  group-by:
    description: 'Grouping dimension: SERVICE (default), LINKED_ACCOUNT, or TAG:<Key> (e.g. TAG:Environment to track Untagged / Other costs)'
    required: false
    default: 'SERVICE'
  name:
    description: 'Human-readable name or alias for the AWS account (e.g. Production Core)'
    required: false
    default: ''
  account-name:
    description: 'Alias for name'
    required: false
    default: ''
  filter:
    description: 'Comma-separated substring filter for services or line items'
    required: false
    default: ''
  tag:
    description: 'Filter costs by AWS Cost Allocation Tag (e.g. Environment=Production or Environment=Prod,Stage)'
    required: false
    default: ''
  tag-filter:
    description: 'Alias for tag'
    required: false
    default: ''
  exclude-credits:
    description: 'Exclude credits and refunds from billing calculations (true/false)'
    required: false
    default: 'false'
  charge-type:
    description: 'Filter costs by charge/record type (e.g. Usage,Tax,Credit,Refund)'
    required: false
    default: ''
  record-type:
    description: 'Alias for charge-type'
    required: false
    default: ''
  region:
    description: 'Filter costs by comma-separated AWS regions (e.g. us-east-1,eu-west-1)'
    required: false
    default: ''
  assume-role-arn:
    description: 'AWS IAM Role ARN to assume via STS for cross-account cost auditing'
    required: false
    default: ''
  role-to-assume:
    description: 'Alias for assume-role-arn'
    required: false
    default: ''
  role-session-name:
    description: 'Optional session name when assuming an IAM role'
    required: false
    default: ''
  threshold:
    description: 'Budget alert threshold amount (e.g. 500.00). Alerts in Step Summary and fails step if exceeded.'
    required: false
    default: ''
  fail-on-threshold:
    description: 'Whether to exit with failure if the budget threshold is breached (true/false)'
    required: false
    default: 'true'
  min-cost:
    description: 'Minimum cost threshold to display'
    required: false
    default: ''
  top:
    description: 'Show top N highest cost items and aggregate remainder into Other'
    required: false
    default: ''
  slack-webhook:
    description: 'Incoming Slack webhook URL to post formatted cost report'
    required: false
    default: ''
  teams-webhook:
    description: 'Incoming Microsoft Teams webhook URL to post formatted cost report'
    required: false
    default: ''
  webhook-url:
    description: 'Generic HTTP/HTTPS webhook URL to post formatted cost report JSON'
    required: false
    default: ''
  write-summary:
    description: 'Whether to write markdown report to GitHub Step Summary ($GITHUB_STEP_SUMMARY)'
    required: false
    default: 'true'
  mock:
    description: 'Run in offline mock mode with simulated billing data (true/false)'
    required: false
    default: 'false'
  no-cache:
    description: 'Disable local query response caching (true/false)'
    required: false
    default: 'false'
  config:
    description: 'Path to custom YAML configuration file'
    required: false
    default: ''
  s3-bucket:
    description: 'Optional S3 bucket name to automatically upload cost report'
    required: false
    default: ''
  s3-key:
    description: 'Optional S3 object key when using s3-bucket (e.g. reports/cost-report.md)'
    required: false
    default: ''
  output-file:
    description: 'Optional file path to save report output'
    required: false
    default: ''
  currency:
    description: 'Override currency code and symbol (e.g. USD, EUR, GBP). Auto-detected from AWS by default.'
    required: false
    default: ''
  monthly:
    description: 'Display multi-month historical breakdown with each month as a separate column (true/false)'
    required: false
    default: 'false'
  mtd:
    description: 'Query Month-to-Date spend from the 1st of the current month up to today (true/false)'
    required: false
    default: 'false'
  forecast:
    description: 'Query AWS Cost Explorer projected month-end spend forecast and guardrail (true/false)'
    required: false
    default: 'false'
  daily:
    description: 'Query daily spend granularity over the billing period (true/false)'
    required: false
    default: 'false'

outputs:
  report:
    description: 'The formatted cost report output'
    value: ${{ steps.run-report.outputs.report }}
  total-cost:
    description: 'Total cost for the current period'
    value: ${{ steps.run-report.outputs.total_cost }}
  previous-cost:
    description: 'Total cost for the previous comparison period'
    value: ${{ steps.run-report.outputs.previous_cost }}
  cost-delta:
    description: 'Absolute cost delta amount'
    value: ${{ steps.run-report.outputs.cost_delta }}
  cost-delta-pct:
    description: 'Percentage change in cost'
    value: ${{ steps.run-report.outputs.cost_delta_pct }}
  threshold-breached:
    description: 'Whether the budget threshold was breached (true/false)'
    value: ${{ steps.run-report.outputs.threshold_breached }}
  forecast-amount:
    description: 'Projected month-end spend amount'
    value: ${{ steps.run-report.outputs.forecast_amount }}
  forecast-breached:
    description: 'Whether projected month-end spend breached threshold (true/false)'
    value: ${{ steps.run-report.outputs.forecast_breached }}
  report-file:
    description: 'File path where the report was saved if output-file was specified'
    value: ${{ steps.run-report.outputs.report_file }}
  period:
    description: 'The reported on date period (e.g. 2026-09-01 to 2026-09-30)'
    value: ${{ steps.run-report.outputs.period }}
  period-start:
    description: 'Start date of the reported period (YYYY-MM-DD)'
    value: ${{ steps.run-report.outputs.period_start }}
  period-end:
    description: 'Inclusive end date of the reported period (YYYY-MM-DD)'
    value: ${{ steps.run-report.outputs.period_end }}
  billing-month:
    description: 'Billing month descriptor (e.g. September 2026)'
    value: ${{ steps.run-report.outputs.billing_month }}

runs:
  using: 'composite'
  steps:
    - name: Set up aws-cost-report CLI
      id: setup-cli
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if command -v aws-cost-report >/dev/null 2>&1; then
          echo "aws-cost-report already present in PATH at $(command -v aws-cost-report)"
          exit 0
        fi

        if [ -x "./bin/aws-cost-report" ]; then
          echo "Found local repository binary at ./bin/aws-cost-report"
          echo "$(pwd)/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        # If running within repository source workspace and Go is installed, build fresh binary
        if [ -f "./cmd/aws-cost-report/main.go" ] && command -v go >/dev/null 2>&1; then
          echo "Found repository Go sources; compiling local binary..."
          mkdir -p "./bin"
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "./bin/aws-cost-report" ./cmd/aws-cost-report
          echo "$(pwd)/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        OS_NAME="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH_NAME="$(uname -m)"

        case "$OS_NAME" in
          linux) OS="linux" ;;
          darwin) OS="darwin" ;;
          *) echo "::error::Unsupported operating system: $OS_NAME"; exit 1 ;;
        esac

        case "$ARCH_NAME" in
          x86_64|amd64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
          *) echo "::error::Unsupported architecture: $ARCH_NAME"; exit 1 ;;
        esac

        BIN_DIR="${RUNNER_TEMP:-/tmp}/aws-cost-report-bin"
        mkdir -p "$BIN_DIR"

        VERSION="$INPUT_VERSION"

        if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$ACTION_REF"
          fi
        fi

        if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
          RESOLVED_TAG=$(curl -sI https://github.com/smford/aws-cost-report/releases/latest 2>/dev/null | grep -i "^location:" | head -n1 | sed -E 's/.*\/tag\///' | tr -d '\r\n ')
          if [ -n "$RESOLVED_TAG" ] && [[ "$RESOLVED_TAG" =~ ^v[0-9]+ ]]; then
            VERSION="$RESOLVED_TAG"
          else
            VERSION="v0.13.0"
          fi
        fi
        VER_NUM="${VERSION#v}"

        TAR_NAME="aws-cost-report_${VER_NUM}_${OS}_${ARCH}.tar.gz"
        DOWNLOAD_URL="https://github.com/smford/aws-cost-report/releases/download/${VERSION}/${TAR_NAME}"

        echo "Fetching aws-cost-report ${VERSION} (${OS}/${ARCH})..."
        if curl -fsSL "$DOWNLOAD_URL" -o "${BIN_DIR}/${TAR_NAME}"; then
          tar -xzf "${BIN_DIR}/${TAR_NAME}" -C "$BIN_DIR" aws-cost-report
          chmod +x "${BIN_DIR}/aws-cost-report"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "Successfully installed aws-cost-report ${VERSION} to ${BIN_DIR}"
        else
          if command -v go >/dev/null 2>&1; then
            echo "::warning::Release download failed; building from source via go install..."
            GOBIN="$BIN_DIR" CGO_ENABLED=0 go install github.com/smford/aws-cost-report/cmd/aws-cost-report@latest || true
            if [ -x "${BIN_DIR}/aws-cost-report" ]; then
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              exit 0
            fi
          fi
          echo "::error::Failed to download or build aws-cost-report from ${DOWNLOAD_URL}"
          exit 1
        fi

    - name: Execute AWS Cost Report
      id: run-report
      shell: bash
      env:
        INPUT_COMPARE: ${{ inputs.compare }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MONTHS: ${{ inputs.months }}
        INPUT_START: ${{ inputs.start }}
        INPUT_END: ${{ inputs.end }}
        INPUT_GROUP_BY: ${{ inputs.group-by }}
        INPUT_FILTER: ${{ inputs.filter }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_TAG_FILTER: ${{ inputs.tag-filter }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_MIN_COST: ${{ inputs.min-cost }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        INPUT_TEAMS_WEBHOOK: ${{ inputs.teams-webhook }}
        INPUT_WEBHOOK_URL: ${{ inputs.webhook-url }}
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_KEY: ${{ inputs.s3-key }}
        INPUT_WRITE_SUMMARY: ${{ inputs.write-summary }}
        INPUT_MOCK: ${{ inputs.mock }}
        INPUT_NO_CACHE: ${{ inputs.no-cache }}
        INPUT_MONTHLY: ${{ inputs.monthly }}
        INPUT_MTD: ${{ inputs.mtd }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_ACCOUNT_NAME: ${{ inputs.account-name }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_ASSUME_ROLE_ARN: ${{ inputs.assume-role-arn }}
        INPUT_ROLE_TO_ASSUME: ${{ inputs.role-to-assume }}
        INPUT_ROLE_SESSION_NAME: ${{ inputs.role-session-name }}
        INPUT_CURRENCY: ${{ inputs.currency }}
        INPUT_FORECAST: ${{ inputs.forecast }}
        INPUT_DAILY: ${{ inputs.daily }}
        INPUT_EXCLUDE_CREDITS: ${{ inputs.exclude-credits }}
        INPUT_CHARGE_TYPE: ${{ inputs.charge-type }}
        INPUT_RECORD_TYPE: ${{ inputs.record-type }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}
      run: |
        ARGS=()

        if [ "$INPUT_COMPARE" = "true" ]; then
          ARGS+=("--compare")
        fi

        if [ -n "$INPUT_FORMAT" ]; then
          ARGS+=("--format=$INPUT_FORMAT")
        fi

        if [ -n "$INPUT_MONTHS" ] && [ "$INPUT_MONTHS" != "0" ]; then
          ARGS+=("--months=$INPUT_MONTHS")
        fi

        if [ -n "$INPUT_START" ]; then
          ARGS+=("--start=$INPUT_START")
        fi

        if [ -n "$INPUT_END" ]; then
          ARGS+=("--end=$INPUT_END")
        fi

        if [ -n "$INPUT_GROUP_BY" ]; then
          ARGS+=("--group-by=$INPUT_GROUP_BY")
        fi

        if [ -n "$INPUT_FILTER" ]; then
          ARGS+=("--filter=$INPUT_FILTER")
        fi

        if [ -n "$INPUT_TAG" ]; then
          ARGS+=("--tag=$INPUT_TAG")
        elif [ -n "$INPUT_TAG_FILTER" ]; then
          ARGS+=("--tag-filter=$INPUT_TAG_FILTER")
        fi

        if [ -n "$INPUT_THRESHOLD" ]; then
          ARGS+=("--threshold=$INPUT_THRESHOLD")
        fi

        if [ -n "$INPUT_MIN_COST" ]; then
          ARGS+=("--min-cost=$INPUT_MIN_COST")
        fi

        if [ -n "$INPUT_TOP" ]; then
          ARGS+=("--top=$INPUT_TOP")
        fi

        if [ -n "$INPUT_SLACK_WEBHOOK" ]; then
          ARGS+=("--slack-webhook=$INPUT_SLACK_WEBHOOK")
        fi

        if [ -n "$INPUT_TEAMS_WEBHOOK" ]; then
          ARGS+=("--teams-webhook=$INPUT_TEAMS_WEBHOOK")
        fi

        if [ -n "$INPUT_WEBHOOK_URL" ]; then
          ARGS+=("--webhook-url=$INPUT_WEBHOOK_URL")
        fi

        if [ -n "$INPUT_S3_BUCKET" ]; then
          ARGS+=("--s3-bucket=$INPUT_S3_BUCKET")
        fi

        if [ -n "$INPUT_S3_KEY" ]; then
          ARGS+=("--s3-key=$INPUT_S3_KEY")
        fi

        if [ "$INPUT_WRITE_SUMMARY" = "true" ]; then
          ARGS+=("--write-summary=true")
        else
          ARGS+=("--write-summary=false")
        fi

        if [ "$INPUT_MOCK" = "true" ]; then
          ARGS+=("--mock")
        fi

        if [ "$INPUT_NO_CACHE" = "true" ]; then
          ARGS+=("--no-cache")
        fi

        if [ "$INPUT_MONTHLY" = "true" ]; then
          ARGS+=("--monthly")
        fi

        if [ "$INPUT_MTD" = "true" ]; then
          ARGS+=("--mtd")
        fi

        if [ -n "$INPUT_NAME" ]; then
          ARGS+=("--name=$INPUT_NAME")
        elif [ -n "$INPUT_ACCOUNT_NAME" ]; then
          ARGS+=("--name=$INPUT_ACCOUNT_NAME")
        fi

        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=("--config=$INPUT_CONFIG")
        fi

        if [ -n "$INPUT_REGION" ]; then
          ARGS+=("--region=$INPUT_REGION")
        fi

        if [ -n "$INPUT_ASSUME_ROLE_ARN" ]; then
          ARGS+=("--assume-role-arn=$INPUT_ASSUME_ROLE_ARN")
        elif [ -n "$INPUT_ROLE_TO_ASSUME" ]; then
          ARGS+=("--assume-role-arn=$INPUT_ROLE_TO_ASSUME")
        fi

        if [ -n "$INPUT_ROLE_SESSION_NAME" ]; then
          ARGS+=("--role-session-name=$INPUT_ROLE_SESSION_NAME")
        fi

        if [ -n "$INPUT_CURRENCY" ]; then
          ARGS+=("--currency=$INPUT_CURRENCY")
        fi

        if [ "$INPUT_FORECAST" = "true" ]; then
          ARGS+=("--forecast")
        fi

        if [ "$INPUT_DAILY" = "true" ]; then
          ARGS+=("--daily")
        fi

        if [ "$INPUT_EXCLUDE_CREDITS" = "true" ]; then
          ARGS+=("--exclude-credits")
        fi

        if [ -n "$INPUT_CHARGE_TYPE" ]; then
          ARGS+=("--charge-type=$INPUT_CHARGE_TYPE")
        elif [ -n "$INPUT_RECORD_TYPE" ]; then
          ARGS+=("--charge-type=$INPUT_RECORD_TYPE")
        fi

        REPORT_TMP="${RUNNER_TEMP:-/tmp}/aws-cost-report-output.txt"
        SUMMARY_TMP="${RUNNER_TEMP:-/tmp}/aws-cost-report-summary.json"

        # Check if the installed binary supports --json-summary
        if aws-cost-report --help 2>&1 | grep -q -- "--json-summary"; then
          ARGS+=("--json-summary=${SUMMARY_TMP}")
        fi

        set +e
        if aws-cost-report help 2>&1 | grep -q "generate"; then
          aws-cost-report generate "${ARGS[@]}" > "$REPORT_TMP"
        else
          aws-cost-report "${ARGS[@]}" > "$REPORT_TMP"
        fi
        EXIT_CODE=$?
        set -e

        # Print output to runner stdout
        cat "$REPORT_TMP"

        # Handle optional output-file
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"
          cp "$REPORT_TMP" "$INPUT_OUTPUT_FILE"
          echo "report_file=$INPUT_OUTPUT_FILE" >> "$GITHUB_OUTPUT"
        fi

        # Write multiline report output to GITHUB_OUTPUT
        {
          echo "report<<EOF"
          cat "$REPORT_TMP"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        # Populate structured output metrics
        PERIOD=""
        PERIOD_START=""
        PERIOD_END=""
        BILLING_MONTH=""

        if [ -f "$SUMMARY_TMP" ]; then
          TOTAL_COST=$(jq -r '.total_cost // "0.00"' "$SUMMARY_TMP")
          PREV_COST=$(jq -r '.previous_cost // "0.00"' "$SUMMARY_TMP")
          COST_DELTA=$(jq -r '.cost_delta // "0.00"' "$SUMMARY_TMP")
          COST_DELTA_PCT=$(jq -r '.cost_delta_pct // "0.00"' "$SUMMARY_TMP")
          BREACHED=$(jq -r '.threshold_breached // false' "$SUMMARY_TMP")
          echo "total_cost=${TOTAL_COST}" >> "$GITHUB_OUTPUT"
          echo "previous_cost=${PREV_COST}" >> "$GITHUB_OUTPUT"
          echo "cost_delta=${COST_DELTA}" >> "$GITHUB_OUTPUT"
          echo "cost_delta_pct=${COST_DELTA_PCT}" >> "$GITHUB_OUTPUT"
          echo "threshold_breached=${BREACHED}" >> "$GITHUB_OUTPUT"
          FORECAST_AMOUNT=$(jq -r '.forecast_amount // "0.00"' "$SUMMARY_TMP")
          FORECAST_BREACHED=$(jq -r '.forecast_breached // false' "$SUMMARY_TMP")
          echo "forecast_amount=${FORECAST_AMOUNT}" >> "$GITHUB_OUTPUT"
          echo "forecast_breached=${FORECAST_BREACHED}" >> "$GITHUB_OUTPUT"
          PERIOD_START=$(jq -r '.period_start // ""' "$SUMMARY_TMP")
          PERIOD_END=$(jq -r '.period_end // ""' "$SUMMARY_TMP")
          BILLING_MONTH=$(jq -r '.billing_month // ""' "$SUMMARY_TMP")
          PERIOD=$(jq -r '.period // ""' "$SUMMARY_TMP")
        else
          if [ -n "$INPUT_THRESHOLD" ] && [ "$EXIT_CODE" -ne 0 ]; then
            echo "threshold_breached=true" >> "$GITHUB_OUTPUT"
          else
            echo "threshold_breached=false" >> "$GITHUB_OUTPUT"
          fi
        fi

        # Fallback period extraction from report text if not populated by summary JSON
        if [ -z "$PERIOD" ]; then
          if [ -n "$PERIOD_START" ] && [ -n "$PERIOD_END" ]; then
            PERIOD="${PERIOD_START} to ${PERIOD_END}"
          else
            PARSED_PERIOD=$(grep -E '\|[[:space:]]*\*\*Period\*\*[[:space:]]*\|' "$REPORT_TMP" 2>/dev/null | head -n1 | sed -E 's/.*\|[[:space:]]*\*\*Period\*\*[[:space:]]*\|[[:space:]]*([^|(]+).*/\1/' | sed -e 's/[[:space:]]*$//')
            if [ -z "$PARSED_PERIOD" ]; then
              PARSED_PERIOD=$(grep -E '^[[:space:]]*Period:[[:space:]]*' "$REPORT_TMP" 2>/dev/null | head -n1 | sed -E 's/^[[:space:]]*Period:[[:space:]]*([^(\n]+).*/\1/' | sed -e 's/[[:space:]]*$//')
            fi
            if [ -n "$PARSED_PERIOD" ]; then
              PERIOD="$PARSED_PERIOD"
              PERIOD_START=$(echo "$PARSED_PERIOD" | awk '{print $1}')
              PERIOD_END=$(echo "$PARSED_PERIOD" | awk '{print $3}')
            fi
          fi
        fi

        if [ -z "$BILLING_MONTH" ]; then
          BILLING_MONTH=$(grep -E '\|[[:space:]]*\*\*Billing Month\*\*[[:space:]]*\|' "$REPORT_TMP" 2>/dev/null | head -n1 | sed -E 's/.*\|[[:space:]]*\*\*Billing Month\*\*[[:space:]]*\|[[:space:]]*([^|]+).*/\1/' | sed -e 's/[[:space:]]*$//')
          if [ -z "$BILLING_MONTH" ]; then
            BILLING_MONTH=$(grep -E '^[[:space:]]*Billing Month:[[:space:]]*' "$REPORT_TMP" 2>/dev/null | head -n1 | sed -E 's/^[[:space:]]*Billing Month:[[:space:]]*([^\n]+).*/\1/' | sed -e 's/[[:space:]]*$//')
          fi
        fi

        echo "period=${PERIOD}" >> "$GITHUB_OUTPUT"
        echo "period_start=${PERIOD_START}" >> "$GITHUB_OUTPUT"
        echo "period_end=${PERIOD_END}" >> "$GITHUB_OUTPUT"
        echo "billing_month=${BILLING_MONTH}" >> "$GITHUB_OUTPUT"

        # Check exit behavior for threshold breaches
        if [ "$EXIT_CODE" -ne 0 ]; then
          if [ "$INPUT_FAIL_ON_THRESHOLD" = "false" ] && [ -n "$INPUT_THRESHOLD" ]; then
            echo "::warning::Budget threshold exceeded, but fail-on-threshold is set to false. Proceeding."
            exit 0
          fi
          exit "$EXIT_CODE"
        fi
